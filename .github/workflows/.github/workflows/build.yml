name: Tutorial 3 Maven CI

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Maven Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Maven build
        run: mvn clean test
